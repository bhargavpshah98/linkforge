services:
  linkforge:
    build: .
    ports:
      - "4000:4000"
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:4000}
      APP_URL: ${BASE_URL:-http://localhost:4000}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env or your shell}
      IP_HASH_SALT: ${IP_HASH_SALT:-change-me}
    volumes:
      - linkforge-data:/data
    restart: unless-stopped

volumes:
  linkforge-data:
